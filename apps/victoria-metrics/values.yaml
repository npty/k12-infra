# VictoriaMetrics k8s-stack 0.98.1 (app v1.156.0) on single-node k3s.
# Namespace: monitoring. ArgoCD app name: victoria-metrics (also the Helm
# release name).
# nameOverride: vmks keeps operator CR names short
# (victoria-metrics-vmks, not victoria-metrics-victoria-metrics-k8s-stack):
# the long form made the vmalertmanager pod label 67 bytes (> 63 limit) so
# its StatefulSet could never create a pod (found 2026-11-10).
nameOverride: vmks

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    # NOTE: retentionMaxDiskSpaceUsageBytes is NOT a VMSingle v1beta1 field
    # (ArgoCD SyncFailed on it 2026-11-10); disk is capped by the 20Gi PVC
    # plus a disk-usage alert instead. VLSingle DOES have the field.
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 2Gi }
    storage:
      resources:
        requests: { storage: 20Gi }

vlsingle:
  enabled: true
  spec:
    retentionPeriod: "14d"
    retentionMaxDiskSpaceUsageBytes: "16GiB"
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 2Gi }
    storage:
      resources:
        requests: { storage: 20Gi }

vlagent:
  enabled: true
  spec:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

vmagent:
  spec:
    scrapeInterval: 30s
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

vmalert:
  spec:
    evaluationInterval: 30s
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

# k3s: kube-controller-manager, kube-scheduler and etcd are embedded in the
# k3s server process bound to 127.0.0.1 with no pods, so the chart's default
# Services for them would have zero endpoints and fire alerts forever.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

# k3s/containerd: host / is a private mount, so the node-exporter rootfs
# mount with HostToContainer propagation fails container creation
# ("path / is mounted on / but it is not a shared or slave mount").
# None keeps the mount without requiring a shared host mount.
prometheus-node-exporter:
  hostRootFsMount:
    mountPropagation: None
defaultRules:
  groups:
    etcd: { enabled: false }

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    type: pvc
    enabled: true
    size: 2Gi
  plugins:
    - victoriametrics-logs-datasource
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

# Dashboard ConfigMaps can exceed the 256KB annotation limit; sync them
# server-side (Application also sets ServerSideApply=true).
defaultDashboards:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
