apiVersion: v1
kind: ConfigMap
metadata:
  name: poke-hub-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: grafana
    grafana_dashboard: "1"
data:
  poke-hub.json: |
    {
      "id": null,
      "uid": "app-poke-hub",
      "title": "Poke Hub",
      "tags": [
        "k12",
        "per-app",
        "logs"
      ],
      "timezone": "browser",
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "30s",
          "1m",
          "5m",
          "15m"
        ]
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "links": [
        {
          "type": "dashboards",
          "title": "K12 dashboards",
          "tags": [
            "k12"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "icon": "external link"
        },
        {
          "type": "link",
          "title": "Status page",
          "url": "https://gatus.npty.online",
          "targetBlank": true,
          "icon": "external link",
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": []
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 2
          },
          "options": {
            "mode": "markdown",
            "content": "**Poke Hub** · MCP hub on Vercel, logs shipped to K12 via OTLP · [poke.npty.online](https://poke.npty.online) · [Overview](/d/k12-overview)"
          },
          "transparent": true
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Errors",
          "description": "LogsQL: * | filter service.name:poke-hub | filter severity_text:\"error\" | stats count(). Over the selected time range.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 2,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | filter severity_text:\"error\" | stats count()",
              "queryType": "stats"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Warnings",
          "description": "LogsQL: * | filter service.name:poke-hub | filter severity_text:\"warn\" | stats count(). Over the selected time range.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 8,
            "y": 2,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | filter severity_text:\"warn\" | stats count()",
              "queryType": "stats"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "orange",
                    "value": 25
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Log lines",
          "description": "LogsQL: * | filter service.name:poke-hub | stats count(). 0 means the app is quiet or silent.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 16,
            "y": 2,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | stats count()",
              "queryType": "stats"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Log lines and errors per hour",
          "description": "Hourly log volume (blue) and error lines (red).",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | stats count()",
              "queryType": "statsRange",
              "step": "1h"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | filter severity_text:\"error\" | stats count()",
              "queryType": "statsRange",
              "step": "1h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 18,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "noValue": "0",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Log lines"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Errors"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "logs",
          "title": "Needs attention: errors and warnings",
          "description": "Error lines (A) and warning lines (B), newest first. Empty is good.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | filter severity_text:\"error\" | copy severity_text as level"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | filter severity_text:\"warn\" | copy severity_text as level"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          }
        },
        {
          "id": 7,
          "type": "logs",
          "title": "Latest log lines",
          "description": "LogsQL: * | filter service.name:poke-hub. Every line, newest first.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | copy severity_text as level"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          }
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Business events",
          "description": "Completed calls and heartbeats only, newest first.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | filter \"capability.call\" | filter \"completed\" | copy severity_text as level"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter action:\"heartbeat\" | filter service.name:poke-hub | copy severity_text as level"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Notes",
          "collapsed": true,
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 24,
            "h": 1
          },
          "panels": [
            {
              "id": 10,
              "type": "text",
              "title": "",
              "gridPos": {
                "x": 0,
                "y": 30,
                "w": 24,
                "h": 4
              },
              "options": {
                "mode": "markdown",
                "content": "No Gatus endpoint and no pods (Vercel app, not k8s). Logs MCP requests (`mcp.request`), tool calls (`capability.call`, for example `gmail.attachment`) and `external.call`. *Business events* shows completed capability calls only. Log level comes from the OTLP `severity_text`."
              },
              "transparent": true
            }
          ]
        }
      ]
    }
