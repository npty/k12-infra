          "options": {
            "mode": "markdown",
            "content": "**Poke Hub** - the MCP hub on Vercel (poke.npty.online), shipping logs to K12 via OTLP. No Gatus endpoint (Vercel app, not k8s). Back to [Logs at a glance](https://grafana.npty.online/d/logs-at-a-glance).\n\n**Logging:** 104 lines in the last 24h, 576 in 7d (checked 2026-11-13) - MCP requests and completed tool calls. The business panel shows completed capability calls only (10 in 24h, 66 in 7d). Whoop calls are new since 2026-11-11: whoop.get_today 6, whoop.get_recovery_trends 6 in 7d."
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 2,
          "title": "Errors in the last 24 hours",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: * | filter service.name:poke-hub | filter severity_text:\"error\" | stats count(). Failed events from this app only, in the last 24h.",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 8,
            "h": 7
