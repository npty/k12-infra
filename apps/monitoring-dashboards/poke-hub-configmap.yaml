            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 14,
            "y": 12,
            "w": 10,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "service.name:poke-hub action:capability.call status:in(completed,failed) | extract \"<integration>.<_>\" from toolName | stats by (integration) count() calls",
              "queryType": "statsRange",
              "step": "1h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 18,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "noValue": "0",
              "min": 0
            },
            "overrides": []
          },
          "options": {
