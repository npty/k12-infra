apiVersion: v1
kind: ConfigMap
metadata:
  name: pmdr-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: grafana
    grafana_dashboard: "1"
data:
  pmdr.json: |
    {
      "id": null,
      "uid": "app-pmdr",
      "title": "PMDR",
      "tags": [
        "k12",
        "per-app",
        "logs"
      ],
      "timezone": "browser",
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "30s",
          "1m",
          "5m",
          "15m"
        ]
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "links": [
        {
          "type": "dashboards",
          "title": "K12 dashboards",
          "tags": [
            "k12"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "icon": "external link"
        },
        {
          "type": "link",
          "title": "Status page",
          "url": "https://gatus.npty.online",
          "targetBlank": true,
          "icon": "external link",
          "asDropdown": false,
          "includeVars": false,
          "keepTime": false,
          "tags": []
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 2
          },
          "options": {
            "mode": "markdown",
            "content": "**PMDR** · stateless Next.js app · [pmdr.npty.online](https://pmdr.npty.online) · [Overview](/d/k12-overview)"
          },
          "transparent": true
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Status",
          "description": "Latest Gatus check for PMDR. Full history: https://gatus.npty.online",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 0,
            "y": 2,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "max(gatus_results_endpoint_success{name=\"PMDR\"})",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "noValue": "n/a",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 0
                    },
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Uptime",
          "description": "Share of Gatus checks that passed in the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 4,
            "y": 2,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "avg_over_time(gatus_results_endpoint_success{name=\"PMDR\"}[$__range]) * 100",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "percent",
              "noValue": "n/a",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 95
                  },
                  {
                    "color": "green",
                    "value": 99.5
                  }
                ]
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pods ready",
          "description": "Ready pods in namespace pmdr. 0 means nothing is running.",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 8,
            "y": 2,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(kube_pod_status_ready{namespace=\"pmdr\",condition=\"true\"}) or vector(0)",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Restarts",
          "description": "Container restarts in the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 12,
            "y": 2,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"pmdr\"}[$__range])) or vector(0)",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Errors",
          "description": "LogsQL: {kubernetes.pod_namespace=\"pmdr\"} | filter \"Error\" | stats count(). Over the selected time range.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 16,
            "y": 2,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"pmdr\"} | filter \"Error\" | stats count()",
              "queryType": "stats"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Warnings",
          "description": "LogsQL: {kubernetes.pod_namespace=\"pmdr\"} | filter \"warn\" | stats count(). Over the selected time range.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 20,
            "y": 2,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"pmdr\"} | filter \"warn\" | stats count()",
              "queryType": "stats"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "orange",
                    "value": 25
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Log lines and errors per hour",
          "description": "Hourly log volume (blue) and error lines (red).",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"pmdr\"} | stats count()",
              "queryType": "statsRange",
              "step": "1h"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"pmdr\"} | filter \"Error\" | stats count()",
              "queryType": "statsRange",
              "step": "1h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 18,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "noValue": "0",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Log lines"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Errors"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "CPU and memory",
          "description": "CPU (cores, left) and working-set memory (right) of namespace pmdr.",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"pmdr\",container!=\"\"}[5m]))",
              "legendFormat": "CPU (cores)",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"pmdr\",container!=\"\"})",
              "legendFormat": "Memory",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 18,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "noValue": "0",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU (cores)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Needs attention: errors and warnings",
          "description": "Error lines (A) and warning lines (B), newest first. Empty is good.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"pmdr\"} | filter \"Error\" | format \"error\" as level"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"pmdr\"} | filter \"warn\" | format \"warn\" as level"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          }
        },
        {
          "id": 11,
          "type": "logs",
          "title": "Latest log lines",
          "description": "LogsQL: {kubernetes.pod_namespace=\"pmdr\"}. Every line from this app, newest first.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"pmdr\"}"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          }
        },
        {
          "id": 12,
          "type": "row",
          "title": "Notes",
          "collapsed": true,
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 24,
            "h": 1
          },
          "panels": [
            {
              "id": 13,
              "type": "text",
              "title": "",
              "gridPos": {
                "x": 0,
                "y": 30,
                "w": 24,
                "h": 4
              },
              "options": {
                "mode": "markdown",
                "content": "Gatus checks `/api/health`. Logs are mostly the Next.js startup banner plus any app errors, so a quiet log panel is normal."
              },
              "transparent": true
            }
          ]
        }
      ]
    }
