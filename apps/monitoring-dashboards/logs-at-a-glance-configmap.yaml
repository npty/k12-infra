apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-at-a-glance-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: grafana
    grafana_dashboard: "1"
data:
  logs-at-a-glance.json: |
    {
      "id": null,
      "uid": "logs-at-a-glance",
      "title": "Logs at a glance",
      "tags": [
        "logs",
        "k12"
      ],
      "timezone": "browser",
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "liveNow": false,
      "refresh": "",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": []
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Errors in the last 24 hours",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: * | filter \"Error\" | filter NOT container:\"/glance_migrated-glance-1\" | filter NOT \"hoarder-chrome\" | filter NOT \"helm\" | filter NOT \"inspect\" | filter NOT \"ACME\" | filter NOT \"skipping\" | filter NOT \"could not fetch logs for container\" | stats count(). EXCLUDED NOISE (verified 2026-11-10 and 2026-11-11, single-word filters, each checked to hit only one source): Glance crash-looping on a missing IMMICH_API_KEY (one identical \"Error starting file watcher\" line, ~61,500 lines/day, each duplicated ~14x; Glance was stopped 2026-11-10, so no new lines arrive, but its history still sits in the 24h window) and Hoarder's missing Chrome (one identical \"[Crawler] Failed to connect to the browser instance ... hoarder-chrome\" line, ~17,200/day, retrying every 5s; the crawler was turned off 2026-11-10, so no new lines arrive; excluded by message phrase, not by container, so a different Hoarder error would still show). Since 2026-11-11 also excluded: ArgoCD helm-template errors (\"helm\", ArgoCD namespace only, 57 lines/24h on 2026-11-10, all of them the long \"helm template . --name-template ...\" line from the morning sync; ArgoCD still reports Synced, a different ArgoCD error without the word helm would still show), Alloy \"could not inspect container info\" (\"inspect\", monitoring namespace only, 85 lines/24h, Alloy tailing stopped Docker containers, one line every 15 minutes per dead container id), Traefik ACME failures (\"ACME\", /runtipi-reverse-proxy only, 16 lines/24h, \"Unable to obtain ACME certificate\" - known pre-existing, HTTP-01 never reaches Traefik through the Cloudflare tunnels, public HTTPS is via Cloudflare edge certs), and VictoriaLogs retention-drop warnings embedded in error lines (\"skipping\", monitoring namespace only, vlsingle \"skipping log entry ... too small timestamp\" lines whose embedded Glance text contains the word Error). Since 2026-11-13 also excluded, by exact phrase: Alloy \"could not fetch logs for container\" (4 lines/24h, all in the monitoring namespace, 0 outside it, 5 in 7d - the same dead-container tailing cause as the excluded \"inspect\" lines, just the other wording; verified narrow through the Grafana API). What is left is real and small: on 2026-11-11 the count was 9 in 24h - Immich video-encode permission errors (4), a Runtipi request timeout (1), a cloudflared tunnel control-stream close (1), ArgoCD dashboard-JSON unmarshal warnings (2, history), and one VictoriaLogs query-parse error from a bad probe query (1, history). On 2026-11-13 the count was 24 in 24h, ALL Immich video-encode errors - the known NVENC \"Operation not permitted\" fallback (ffmpeg cannot init the GPU device, retries with NVENC disabled, and the encode then succeeds, so videos are not lost - but the error repeats once per video, ~24/day, up from 4 on 2026-11-10). A new error is a line you do not recognise here. Open it in Explore (VictoriaLogs datasource) with the same query to investigate. The unfiltered query is in the README for operator use. Note: k8s history only goes back to the morning of 2026-11-10 (fresh disks); Docker history goes back 14 days.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter \"Error\" | filter NOT container:\"/glance_migrated-glance-1\" | filter NOT \"hoarder-chrome\" | filter NOT \"helm\" | filter NOT \"inspect\" | filter NOT \"ACME\" | filter NOT \"skipping\" | filter NOT \"could not fetch logs for container\" | stats count()"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "count(*)",
                    "destinationType": "number"
                  }
                ],
                "fields": {}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^count\\(\\*\\)$/"
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 2,
          "title": "Warnings in the last 24 hours",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: * | filter \"warn\" | filter NOT kubernetes.pod_namespace:\"monitoring\" | stats count(). EXCLUDED NOISE (verified 2026-11-10): warnings from the monitoring namespace itself (190 of 192 at check time) - VictoriaLogs/vlagent/vmagent internal warnings, mostly \"skipping log entry ... too small timestamp\" (old Docker lines dropped by the 14-day retention) and startup \"couldn't send a block\" lines from the morning redeploy. Not app problems. They are operator noise; monitoring health is covered by Gatus/vmalert alerts instead, and the unfiltered query is in the README for operator use. After the exclusion this panel showed 2 (both ArgoCD warnings about unmarshalling this dashboard's JSON - a known, already-fixed ComparisonError). If this number jumps, something new is warning.",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter \"warn\" | filter NOT kubernetes.pod_namespace:\"monitoring\" | stats count()"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "count(*)",
                    "destinationType": "number"
                  }
                ],
                "fields": {}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^count\\(\\*\\)$/"
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 3,
          "title": "Failed checks in the last 24 hours (Gatus)",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: {kubernetes.pod_namespace=\"gatus\"} | filter \"success=false\" | stats count(). Gatus endpoint checks that failed in the last 24h. At build time 98, mostly Grafana failing during the morning redeploy; on 2026-11-13 only 2 in 24h (Grafana 1, Article Archive 1, both a single transient blip on 12 Nov 15:03). Live status is https://gatus.npty.online - that page, not this number, is the up/down truth. The actual failed lines are in the \"Business events\" panel below.",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"gatus\"} | filter \"success=false\" | stats count()"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "count(*)",
                    "destinationType": "number"
                  }
                ],
                "fields": {}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^count\\(\\*\\)$/"
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 4,
          "title": "Errors per hour",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: * | filter \"Error\" | filter NOT container:\"/glance_migrated-glance-1\" | filter NOT \"hoarder-chrome\" | filter NOT \"helm\" | filter NOT \"inspect\" | filter NOT \"ACME\" | filter NOT \"skipping\" | filter NOT \"could not fetch logs for container\" | stats by (_time:1h) count(). Same noise exclusion as panel 1 (Glance + Hoarder Chrome + ArgoCD helm-template + Alloy inspect + Alloy fetch-logs + Traefik ACME + VictoriaLogs skipping). After the second clean-up (2026-11-11) the line is near zero most hours - at most 4 in any hour - a spike above that is what matters, not the height of the line itself.",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter \"Error\" | filter NOT container:\"/glance_migrated-glance-1\" | filter NOT \"hoarder-chrome\" | filter NOT \"helm\" | filter NOT \"inspect\" | filter NOT \"ACME\" | filter NOT \"skipping\" | filter NOT \"could not fetch logs for container\" | stats by (_time:1h) count()"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "count(*)",
                    "destinationType": "number"
                  }
                ],
                "fields": {}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {
              "mode": "single",
              "sort": "none"
            },
            "legend": {
              "showLegend": false
            }
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 5,
          "title": "Top errors by app",
          "type": "table",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: * | filter \"Error\" | filter NOT container:\"/glance_migrated-glance-1\" | filter NOT \"hoarder-chrome\" | filter NOT \"helm\" | filter NOT \"inspect\" | filter NOT \"ACME\" | filter NOT \"skipping\" | filter NOT \"could not fetch logs for container\" | stats by (container, kubernetes.pod_namespace) count(). Same noise exclusion as panel 1. Which app the remaining error lines came from. Docker apps show a container name with a leading slash (e.g. /hoarder_migrated-hoarder-1); k8s apps show a namespace instead and the container cell is blank. Click a column header to sort. On 2026-11-11 the remainder was 9 lines: Immich 4, ArgoCD 2, monitoring 1, cloudflared 1, Runtipi 1. On 2026-11-13 the remainder was 24 lines, all Immich video-encode errors (the NVENC fallback, see panel 1).",
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter \"Error\" | filter NOT container:\"/glance_migrated-glance-1\" | filter NOT \"hoarder-chrome\" | filter NOT \"helm\" | filter NOT \"inspect\" | filter NOT \"ACME\" | filter NOT \"skipping\" | filter NOT \"could not fetch logs for container\" | stats by (container, kubernetes.pod_namespace) count()"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 6,
          "title": "Latest error lines",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: * | filter \"Error\" | filter NOT container:\"/glance_migrated-glance-1\" | filter NOT \"hoarder-chrome\" | filter NOT \"helm\" | filter NOT \"inspect\" | filter NOT \"ACME\" | filter NOT \"skipping\" | filter NOT \"could not fetch logs for container\". The actual error lines, newest first, with the noise removed (see panel 1). Copy this query into Explore (VictoriaLogs datasource) to search and filter further.",
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter \"Error\" | filter NOT container:\"/glance_migrated-glance-1\" | filter NOT \"hoarder-chrome\" | filter NOT \"helm\" | filter NOT \"inspect\" | filter NOT \"ACME\" | filter NOT \"skipping\" | filter NOT \"could not fetch logs for container\""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 7,
          "title": "Latest warnings",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: * | filter \"warn\" | filter NOT kubernetes.pod_namespace:\"monitoring\". Newest warning lines, with the monitoring-stack internal warnings excluded (see panel 2).",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter \"warn\" | filter NOT kubernetes.pod_namespace:\"monitoring\""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 8,
          "title": "Business events - what actually happened",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "Five real event streams, newest first. (A) Heartbeats: * | filter action:\"heartbeat\" - one line each from poke-hub and friendly-actual-budget so far, both manual checks, not a regular pulse (4 in the last 24h at verification on 2026-11-13 ~17:10 Dubai: 3 friendly-actual-budget, 1 poke-hub). (The old exact-phrase filter \"heartbeat completed\" also matched 2 ArgoCD warning lines that embed this dashboard JSON, which mentions that phrase - the action-field filter returns only the real heartbeat lines.) (B) Wallet queue: {kubernetes.pod_namespace=\"wallet-queue\"} - jobs enqueued and completed (4 lines in the last 24h on 2026-11-13). (C) Failed Gatus checks: {kubernetes.pod_namespace=\"gatus\"} | filter \"success=false\" - 2 in the last 24h on 2026-11-13. (D) poke-hub completed tool calls: * | filter service.name:poke-hub | filter \"capability.call\" | filter \"completed\" - 17 in the last 24h, 73 in 7d on 2026-11-13 (~16:50 Dubai; bursty - 5 whoop.get_today calls in one minute at 12:33 UTC), e.g. actual_budget.search_transactions (21 in 7d), whoop.get_today and whoop.get_recovery_trends (11 and 6 in 7d - Whoop calls are new since 2026-11-11), transaction_update (8), transaction_add (6), backup_to_nextcloud (6), bird_eyes (6). These are the real things Muse asked poke-hub to do. (E) Receipt events, NEW 2026-11-13: * | filter service.name:friendly-actual-budget | filter NOT action:\"heartbeat\" - wallet-ingest-queued after a successful enqueue and transaction-confirmed on confirm paths. These had 0 lines on 2026-11-11 (no real receipt had been saved since the OTel deploy on 2026-11-10); real receipts have landed since - 4 queued + 2 confirmed in the last 24h on 2026-11-13 (~17:10 Dubai; two real receipts 08:49 and 09:24 Dubai, each confirmed ~6s after queueing; two more queued lines at 12:42 and 12:48 UTC are test activity with no confirmations), 6 + 4 in 7d. The lines carry no amount or merchant yet, just \"<action> completed\" - enriching them needs a code change in friendly-actual-budget. Of the rail apps, only sentence-gym and whoop-mcp-server are still silent in VL - 0 lines in 7 days, re-checked 2026-11-13 ~17:10 Dubai - startup logs only, and they predate the 2026-11-10 log-stack rebuild. Article-archive and manga-reader STOPPED being silent on 13 Nov ~16:45 Dubai (redeployed with event logging: 29 and 8 lines in 24h), and rail-console restarted at 12:50 UTC with 4 lines - though only its startup line is readable, the rest are VictoriaLogs \"missing _msg field\" notices (its log lines carry no message field yet). Each app also has its own dashboard now (see README) - this panel stays the cross-app view.",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter action:\"heartbeat\""
            },
            {
              "refId": "B",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"wallet-queue\"}"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"gatus\"} | filter \"success=false\""
            },
            {
              "refId": "D",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:poke-hub | filter \"capability.call\" | filter \"completed\""
            },
            {
              "refId": "E",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | filter service.name:friendly-actual-budget | filter NOT action:\"heartbeat\""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          },
          "pluginVersion": "13.2.3"
        }
      ]
    }
