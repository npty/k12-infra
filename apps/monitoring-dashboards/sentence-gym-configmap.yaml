            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "count(*)",
                    "destinationType": "number"
                  }
                ],
                "fields": {}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^count\\(\\*\\)$/"
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 4,
          "title": "Failed Gatus checks in the last 24 hours",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: {kubernetes.pod_namespace=\"gatus\"} | filter \"endpoint=Sentence Gym\" | filter \"success=false\" | stats count(). Gatus checks of this app that failed in the last 24h. Live status is https://gatus.npty.online - that page, not this number, is the up/down truth.",
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"gatus\"} | filter \"endpoint=Sentence Gym\" | filter \"success=false\" | stats count()"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "count(*)",
                    "destinationType": "number"
                  }
                ],
                "fields": {}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^count\\(\\*\\)$/"
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 5,
          "title": "Latest log lines",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: {kubernetes.pod_namespace=\"sentence-gym\"}. All log lines from this app, newest first. If this is empty, the app is silent (see the note at the top) - its logs are not in VictoriaLogs.",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"sentence-gym\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 6,
          "title": "Business events",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "Two streams, newest first. (A) This app's own log lines: {kubernetes.pod_namespace=\"sentence-gym\"} - for wallet-queue these are the enqueued/completed jobs; for the silent apps this is empty. (B) Failed Gatus checks for this app: {kubernetes.pod_namespace=\"gatus\"} | filter \"endpoint=Sentence Gym\" | filter \"success=false\" - normally 0, a line here means Gatus saw the app down.",
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"sentence-gym\"}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"gatus\"} | filter \"endpoint=Sentence Gym\" | filter \"success=false\""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
