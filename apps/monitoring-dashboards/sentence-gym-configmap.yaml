apiVersion: v1
kind: ConfigMap
metadata:
  name: sentence-gym-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: grafana
    grafana_dashboard: "1"
data:
  sentence-gym.json: |
    {
      "id": null,
      "uid": "app-sentence-gym",
      "title": "Sentence Gym",
      "tags": [
        "logs",
        "k12",
        "per-app"
      ],
      "timezone": "browser",
      "editable": false,
      "schemaVersion": 39,
      "version": 1,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "liveNow": false,
      "refresh": "",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": []
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "About this app",
          "type": "text",
          "datasource": null,
          "description": "About this app. Back to the main dashboard: https://grafana.npty.online/d/logs-at-a-glance",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 4
          },
          "options": {
            "mode": "markdown",
            "content": "**Sentence Gym** - the learning app (gym.npty.online). Gatus endpoint: Sentence Gym. Back to [Logs at a glance](https://grafana.npty.online/d/logs-at-a-glance).\n\n**Logging since 13 Nov ~16:52 UTC:** 8 lines in the last 24h - the app restarted (Next.js 16.2.10, Ready in 0ms), so it is NO LONGER silent (it was 0 lines in 7d on 2026-11-11). But only the startup banner lines are readable: half the lines are VictoriaLogs 'missing _msg field' notices, meaning the app's log lines carry no message field. The log format needs a message field before its events become readable - that is a code fix, not a dashboard fix."
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 2,
          "title": "Errors in the last 24 hours",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: {kubernetes.pod_namespace=\"sentence-gym\"} | filter \"Error\" | stats count(). Errors from this app only, in the last 24h.",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "{kubernetes.pod_namespace=\"sentence-gym\"} | filter \"Error\" | stats count()"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "convertFieldType",
              "options": {
                "conversions": [
                  {
                    "targetField": "count(*)",
                    "destinationType": "number"
                  }
                ],
                "fields": {}
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^count\\(\\*\\)$/"
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "pluginVersion": "13.2.3"
        },
        {
          "id": 3,
          "title": "Warnings in the last 24 hours",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "description": "LogsQL: {kubernetes.pod_namespace=\"sentence-gym\"} | filter \"warn\" | stats count(). Warnings from this app only, in the last 24h.",
          "gridPos": {
            "x": 8,
            "y": 4,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
