# Sealed-secrets controller metrics (kube-system).
# Service sealed-secrets-metrics :8081/metrics, verified HTTP 200 live
# 2026-11-10 (go_build_info{version="v0.40.0"}).
# jobLabel uses the Service's app.kubernetes.io/name label so the job is
# `sealed-secrets` (not the service name `sealed-secrets-metrics`).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: sealed-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: sealed-secrets
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/instance: sealed-secrets
      app.kubernetes.io/name: sealed-secrets
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: metrics
      path: /metrics
