# Sentence Gym (npty/sentence-gym-v0) on the K12 rail.
replicaCount: 1

image:
  repository: ghcr.io/npty/sentence-gym-v0
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 3000

service:
  port: 80
  targetPort: 3000
  nodePort: 30080

# GHCR package is private: pull via the ghcr-pull secret (created on K12).
imagePullSecrets:
  - name: ghcr-pull

# Public hostname, routed via the in-cluster cloudflared tunnel (k12-tipis).
host: gym.npty.online

env:
  - name: NODE_ENV
    value: production

# Mirrors the Vercel production env. Set values via the Rail Console
# (secret sentence-gym-secrets), then redeploy. Optional: the pod runs
# fine without them until they are set.
secretEnv:
  - name: POSTGRES_URL
    secretName: sentence-gym-secrets
    key: postgres-url
    optional: true
  - name: OPENROUTER_API_KEY
    secretName: sentence-gym-secrets
    key: openrouter-api-key
    optional: true
  - name: TYPESAFE_API_KEY
    secretName: sentence-gym-secrets
    key: typesafe-api-key
    optional: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

persistence:
  enabled: false
