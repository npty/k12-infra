# First app on the K12 rail. Image built by the app repo's Actions workflow
# and pushed to GHCR (public package); ArgoCD Image Updater tracks the tag.
web-app:
  replicaCount: 1
  image:
    repository: ghcr.io/npty/euro-sapporo-itinerary
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    port: 80
    targetPort: 8080
  # New hostname; the app's existing Vercel deployment is untouched.
  host: sapporo-k12.npty.online
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
