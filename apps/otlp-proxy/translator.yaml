apiVersion: v1
kind: ConfigMap
metadata:
  name: otlp-translator
  namespace: monitoring
data:
  otlp-translate.py: |
    #!/usr/bin/env python3
    """OTLP/JSON -> OTLP/protobuf translator for VictoriaLogs ingest.

    Why this exists: VictoriaLogs' /insert/opentelemetry/v1/logs accepts
    OTLP/HTTP protobuf ONLY ("json encoding isn't supported for opentelemetry
    format"). poke-hub's @opentelemetry/exporter-logs-otlp-http@0.218.0
    HARD-CODES JsonLogsSerializer (Content-Type: application/json) -- there
    is no env var or option to switch it to protobuf (verified from the
    published package source 2026-11-10). So this sidecar accepts the JSON
    the exporter sends, re-encodes it as protobuf, and forwards it to VL.

    Stdlib only (no pip, no custom image): python:3.12-slim + this file
    from a ConfigMap. Listens on 127.0.0.1:8081; nginx routes
    /insert/opentelemetry/v1/logs here, everything else goes to VL direct.

    Field numbers follow the OTLP schema as implemented by
    opentelemetry-proto (the numbering VL v1.53.0 accepts, verified live
    2026-11-10 with a library-built probe): AnyValue string_value=1,
    bool_value=2, int_value=3, double_value=4, array_value=5,
    kvlist_value=6, bytes_value=7.
    """
    import base64
    import gzip
    import json
    import struct
    import sys
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib import request as urlrequest
    from urllib.error import HTTPError

    VL_URL = "http://vlsingle-victoria-metrics-vmks.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs"
    LISTEN = ("127.0.0.1", 8081)


    def varint(n):
        n &= (1 << 64) - 1
        out = b""
        while True:
            b = n & 0x7F
            n >>= 7
            if n:
                out += bytes([b | 0x80])
            else:
                out += bytes([b])
                return out


    def tag(field, wire):
        return varint((field << 3) | wire)


    def msg(field, payload):
        return tag(field, 2) + varint(len(payload)) + payload


    def s(field, text):
        # Proto3 omits empty strings for regular (non-oneof) string fields.
        if text is None or text == "":
            return b""
        return msg(field, str(text).encode("utf-8"))


    def s_oneof(field, text):
        # Oneof members (e.g. AnyValue.string_value) are serialized even when "".
        if text is None:
            return b""
        return msg(field, str(text).encode("utf-8"))


    def v(field, n):
        if n is None:
            return b""
        return tag(field, 0) + varint(int(n))


    def fixed64(field, n):
        if n is None:
            return b""
        return tag(field, 1) + struct.pack("<Q", int(n) & ((1 << 64) - 1))


    def fixed64_double(field, f):
        if f is None:
            return b""
        return tag(field, 1) + struct.pack("<d", float(f))


    def b64bytes(text):
        if not text:
            return b""
        # trace/span ids arrive as hex; bytesValue arrives as base64.
        try:
            return bytes.fromhex(text)
        except ValueError:
            return base64.b64decode(text)


    def any_value(av):
        """Encode one OTLP-JSON AnyValue object to protobuf bytes."""
        if av is None:
            return b""
        if isinstance(av, str):
            return s_oneof(1, av)
        if isinstance(av, bool):
            return v(2, 1 if av else 0)
        if isinstance(av, (int, float)):
            # Bare JSON number (not expected from the exporter, but be safe).
            return fixed64_double(4, av) if isinstance(av, float) else v(3, av)
        if not isinstance(av, dict):
            return b""
        if "stringValue" in av:
            return s_oneof(1, av["stringValue"])
        if "boolValue" in av:
            return v(2, 1 if av["boolValue"] else 0)
        if "intValue" in av:
            return v(3, av["intValue"])
        if "doubleValue" in av:
            return fixed64_double(4, av["doubleValue"])
        if "arrayValue" in av:
            vals = av["arrayValue"].get("values", []) or []
            inner = b"".join(msg(1, any_value(x)) for x in vals)
            return msg(5, inner)
        if "kvlistValue" in av:
            vals = av["kvlistValue"].get("values", []) or []
            inner = b"".join(msg(1, key_value(x)) for x in vals)
            return msg(6, inner)
        if "bytesValue" in av:
            return msg(7, b64bytes(av["bytesValue"]))
        return b""


    def key_value(kv):
        if not isinstance(kv, dict):
            return b""
        return s(1, kv.get("key", "")) + msg(2, any_value(kv.get("value")))


    def log_record(lr):
        out = b""
        out += fixed64(1, lr.get("timeUnixNano"))
        out += v(2, lr.get("severityNumber"))
        out += s(3, lr.get("severityText"))
        if "body" in lr:
            out += msg(5, any_value(lr["body"]))
        for kv in lr.get("attributes", []) or []:
            out += msg(6, key_value(kv))
        out += v(7, lr.get("droppedAttributesCount"))
        if lr.get("flags") is not None:
            # LogRecord.flags is fixed32, not varint.
            out += tag(8, 5) + struct.pack("<I", int(lr["flags"]) & 0xFFFFFFFF)
        if lr.get("traceId"):
            out += msg(9, b64bytes(lr["traceId"]))
        if lr.get("spanId"):
            out += msg(10, b64bytes(lr["spanId"]))
        out += fixed64(11, lr.get("observedTimeUnixNano"))
        return out


    def scope_logs(sl):
        scope = sl.get("scope", {}) or {}
        scope_msg = s(1, scope.get("name", ""))
        scope_msg += s(2, scope.get("version", ""))
        for kv in scope.get("attributes", []) or []:
            scope_msg += msg(3, key_value(kv))
        scope_msg += v(4, scope.get("droppedAttributesCount"))
        out = msg(1, scope_msg)
        for lr in sl.get("logRecords", []) or []:
            out += msg(2, log_record(lr))
        out += s(3, sl.get("schemaUrl", ""))
        return out


    def resource_logs(rl):
        res = rl.get("resource", {}) or {}
        res_msg = b"".join(msg(1, key_value(kv)) for kv in res.get("attributes", []) or [])
        res_msg += v(2, res.get("droppedAttributesCount"))
        out = msg(1, res_msg)
        for sl in rl.get("scopeLogs", []) or []:
            out += msg(2, scope_logs(sl))
        out += s(3, rl.get("schemaUrl", ""))
        return out


    def translate(body_json):
        """OTLP-JSON dict -> ExportLogsServiceRequest protobuf bytes."""
        out = b""
        for rl in body_json.get("resourceLogs", []) or []:
            out += msg(1, resource_logs(rl))
        return out


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def log_message(self, fmt, *args):
            sys.stderr.write("translator: " + fmt % args + "\n")

        def _send(self, code, body=b"", ctype="text/plain"):
            data = body if isinstance(body, bytes) else body.encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(data)

        def do_POST(self):
            length = int(self.headers.get("Content-Length") or 0)
            raw = self.rfile.read(length) if length else b""
            if (self.headers.get("Content-Encoding") or "") == "gzip":
                try:
                    raw = gzip.decompress(raw)
                except Exception as e:
                    self._send(400, f"bad gzip: {e}")
                    return
            try:
                payload = json.loads(raw.decode("utf-8"))
            except Exception as e:
                self._send(400, f"bad OTLP JSON: {e}")
                return
            try:
                pb = translate(payload)
            except Exception as e:
                self._send(400, f"translate failed: {e}")
                return
            req = urlrequest.Request(
                VL_URL, data=pb, method="POST",
                headers={"Content-Type": "application/x-protobuf"},
            )
            try:
                with urlrequest.urlopen(req, timeout=30) as resp:
                    self._send(resp.status, resp.read())
            except HTTPError as e:
                self._send(e.code, e.read())
            except Exception as e:
                self._send(502, f"VL upstream failed: {e}")

        def do_GET(self):
            if self.path == "/health":
                self._send(200, "ok")
            else:
                self._send(404, "not found")


    if __name__ == "__main__":
        ThreadingHTTPServer(LISTEN, Handler).serve_forever()
