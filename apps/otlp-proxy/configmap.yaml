apiVersion: v1
kind: ConfigMap
metadata:
  name: otlp-proxy-nginx
  namespace: monitoring
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
      worker_connections 128;
    }
    http {
      access_log /dev/stdout;
      client_max_body_size 10m;
      server {
        listen 8080;
        # OTLP logs -> translator sidecar (127.0.0.1:8081): the JS OTLP
        # exporter sends JSON, VL accepts protobuf only, so the sidecar
        # re-encodes JSON -> protobuf and forwards to VL. Auth required.
        location /insert/opentelemetry/v1/logs {
          auth_basic "OTLP ingest";
          auth_basic_user_file /etc/nginx/auth/htpasswd;
          proxy_pass http://127.0.0.1:8081;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_read_timeout 30s;
        }
        # Any other /insert/opentelemetry/* path (traces, metrics) -> VL
        # direct. VL 400s them (no VictoriaTraces; VM metrics ingest is a
        # different path) and the SDK fails open. Auth required.
        location /insert/opentelemetry/ {
          auth_basic "OTLP ingest";
          auth_basic_user_file /etc/nginx/auth/htpasswd;
          proxy_pass http://vlsingle-victoria-metrics-vmks.monitoring.svc.cluster.local:9428;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_read_timeout 30s;
        }
        location / {
          return 404;
        }
      }
    }
