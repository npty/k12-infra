apiVersion: v1
kind: ConfigMap
metadata:
  name: otlp-proxy-nginx
  namespace: monitoring
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
      worker_connections 128;
    }
    http {
      access_log /dev/stdout;
      client_max_body_size 10m;
      server {
        listen 8080;
        # OTLP logs (and any other /insert/opentelemetry/* path) -> VL.
        # Auth required; everything else 404s.
        location /insert/opentelemetry/ {
          auth_basic "OTLP ingest";
          auth_basic_user_file /etc/nginx/auth/htpasswd;
          proxy_pass http://vlsingle-victoria-metrics-vmks.monitoring.svc.cluster.local:9428;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_read_timeout 30s;
        }
        location / {
          return 404;
        }
      }
    }
