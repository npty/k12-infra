apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otlp-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otlp-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otlp-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
        - name: translator
          # JSON -> protobuf translator for OTLP logs (see otlp-translate.py).
          # Stdlib only, no pip, no custom image.
          image: python:3.12-slim
          command: ["python3", "/app/otlp-translate.py"]
          ports:
            - name: translate
              containerPort: 8081
          volumeMounts:
            - name: translator-script
              mountPath: /app/otlp-translate.py
              subPath: otlp-translate.py
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: translator-script
          configMap:
            name: otlp-translator
        - name: nginx-conf
          configMap:
            name: otlp-proxy-nginx
        - name: auth
          secret:
            secretName: otlp-proxy-auth
---
apiVersion: v1
kind: Service
metadata:
  name: otlp-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otlp-proxy
spec:
  selector:
    app.kubernetes.io/name: otlp-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
