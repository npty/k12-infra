# "Logs at a glance" Grafana dashboard (plain manifests, provisioned via ConfigMap).
# The grafana-sc-dashboard sidecar watches ConfigMaps labelled grafana_dashboard=1
# and mounts them under /var/lib/grafana/dashboards/default (provider re-reads
# every 30s). Same plain-directory Application pattern as monitoring-scrapes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dashboards
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/npty/k12-infra.git
      targetRevision: HEAD
      path: apps/monitoring-dashboards
      directory:
        # ArgoCD parses every .json in the path as a Kubernetes manifest, so
        # exclude the raw dashboard JSON (it is embedded in the ConfigMap below).
        exclude: "*.json"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
