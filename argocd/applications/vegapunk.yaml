apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vegapunk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/npty/k12-infra.git
    targetRevision: HEAD
    path: apps/vegapunk
  destination:
    server: https://kubernetes.default.svc
    namespace: vegapunk
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
