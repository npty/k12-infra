# Extra Prometheus scrapes for the VictoriaMetrics stack (plain manifests).
# First plain-directory Application in this repo: the victoria-metrics
# Application is a Helm chart source, so scrape CRDs cannot ride along in
# its values.yaml. These CRDs are picked up by vmagent automatically
# (selectAllByDefault: true). Chart versions n/a (raw CRDs, operator
# v1.156.0 / k8s-stack 0.98.1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-scrapes
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/npty/k12-infra.git
      targetRevision: HEAD
      path: apps/monitoring-scrapes
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
