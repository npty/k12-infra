# Grafana Alloy — Docker-host log shipper to VictoriaLogs (Phase 2).
# Chart: alloy 1.14.4 (app v1.21.3), pinned, classic grafana repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.4
      helm:
        valueFiles:
          - $values/apps/alloy/values.yaml
    - repoURL: https://github.com/npty/k12-infra.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
