# Default values for web-app. Override per app in apps/<name>/values.yaml.
replicaCount: 1

image:
  repository: ghcr.io/npty/app
  tag: latest
  pullPolicy: IfNotPresent

# Container port the app listens on
containerPort: 3000

service:
  port: 80
  targetPort: 3000
  # Optional: expose on every node (for host-side tunnel routes). Omit for ClusterIP-only.
  # nodePort: 30080

# Optional: pull secrets for private registries (e.g. GHCR). Omit for public images.
imagePullSecrets: []
# - name: ghcr-pull

# ServiceAccount for the pod. Leave empty for the namespace default.
serviceAccountName: 
# - name: ghcr-pull

# Public hostname, routed via the in-cluster cloudflared tunnel.
# DNS must have a CNAME for this host pointing at the tunnel.
host: app-k12.npty.online

# Plain (non-secret) environment variables
env: []
# - name: NODE_ENV
#   value: production

# Secret-backed env vars (SealedSecret manifests live in git next to the app).
# The referenced Secret must exist in the app namespace (created by the
# sealed-secrets controller from a SealedSecret in apps/<name>/).
secretEnv: []
# - name: OPENROUTER_API_KEY
#   secretName: sentence-gym-secrets
#   key: openrouter-api-key
# - name: NODE_ENV
#   value: production

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Optional persistent storage (e.g. sqlite). Leave empty for stateless apps.
persistence:
  enabled: false
  size: 1Gi
  mountPath: /data
