apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-indexer
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: indexer
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  # Exactly one indexer, and it shares the RWO data volume with web.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/component: indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: indexer
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- /* Same as vegapunk.podSecurity plus supplementalGroups: Nextcloud (www-data, gid 33) writes the
             files this pod indexes as mode 660, which uid/gid 1000 cannot read without that group. */}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        {{- with .Values.indexer.supplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      containers:
        - name: indexer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "worker/index.ts"]
          env:
            {{- include "vegapunk.env" . | nindent 12 }}
            {{- if .Values.indexer.noaiPath }}
            - name: NOAI_PATHS_FILE
              value: /noai/noai-paths.txt
            - name: NOAI_REQUIRED
              value: "1"
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.data.mountPath }}
            - name: nextcloud-files
              mountPath: /data/nextcloud
              readOnly: true
            {{- if .Values.indexer.noaiPath }}
            - name: noai
              mountPath: /noai
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.indexer.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: nextcloud-files
          hostPath:
            path: {{ required "indexer.filesPath (host folder with the Nextcloud files) is required" .Values.indexer.filesPath | quote }}
            type: Directory
        {{- if .Values.indexer.noaiPath }}
        - name: noai
          hostPath:
            path: {{ .Values.indexer.noaiPath | quote }}
            type: Directory
        {{- end }}
